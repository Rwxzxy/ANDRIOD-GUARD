name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / Test / APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew --stacktrace lint

      - name: Unit tests
        run: ./gradlew --stacktrace test

      - name: Decide build type (release if signing secrets exist)
        id: variant
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "已配置签名 Secrets：构建签名的 release APK"
          else
            echo "name=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置签名 Secrets，构建 debug APK（每次 CI 的 debug 签名不同，不能覆盖安装）"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew --stacktrace assembleRelease
          else
            # 没有签名时也编译一次 release（不签名、不上传），用来检查 R8 / ProGuard 规则
            ./gradlew --stacktrace assembleDebug assembleRelease
          fi

      - name: Verify APK has no INTERNET permission
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          AAPT2="${BUILD_TOOLS}aapt2"
          echo "使用 $AAPT2"
          found=0
          for apk in app/build/outputs/apk/*/*.apk; do
            found=1
            echo "== $apk"
            "$AAPT2" dump permissions "$apk" | tee "$RUNNER_TEMP/perms.txt"
            if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/perms.txt"; then
              echo "::error file=$apk::APK 声明了 android.permission.INTERNET"
              exit 1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::没有找到 APK"
            exit 1
          fi
          echo "通过：APK 没有 INTERNET 权限"

      - name: Show signing certificate
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/*/*.apk; do
            "${BUILD_TOOLS}apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-guard-${{ steps.variant.outputs.name }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ steps.variant.outputs.name }}/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
